root = ".."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/press ../cmd/press"
  bin = "tmp/press"
  args_bin = ["serve"]
  include_dir = ["cmd", "internal", "local/themes"]
  include_ext = ["go", "html", "css"]
  exclude_dir = ["tmp", "data", "docs", "node_modules", "local/storage"]
  delay = 1000
  stop_on_error = true
  kill_delay = 500

[log]
  time = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"
