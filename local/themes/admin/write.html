{{define "admin-write"}}
{{template "admin-header" .}}

<form name="post" action="/wp-admin/post/new" method="post" id="post">
    {{.CSRF.For "create-post"}}

    <p>
        <label for="title"><strong>Title</strong></label><br>
        <input type="text" name="post_title" id="title" style="width: 100%; box-sizing: border-box;" autofocus>
    </p>

    <p>
        <label for="content"><strong>Post</strong></label><br>
        <textarea name="content" id="content" rows="15" style="width: 100%; box-sizing: border-box;"></textarea>
    </p>

    <p>
        <label for="excerpt"><strong>Excerpt</strong> (optional)</label><br>
        <textarea name="excerpt" id="excerpt" rows="3" style="width: 100%; box-sizing: border-box;"></textarea>
    </p>

    <fieldset>
        <legend><strong>Categories</strong></legend>
        {{range .Categories}}
        <label>
            <input type="checkbox" name="post_category" value="{{.ID}}"> {{.Name}}
        </label><br>
        {{end}}
    </fieldset>

    <fieldset>
        <legend><strong>Status</strong></legend>
        <label><input type="radio" name="post_status" value="publish" checked> Publish</label>
        <label><input type="radio" name="post_status" value="draft"> Draft</label>
        <label><input type="radio" name="post_status" value="private"> Private</label>
    </fieldset>

    <fieldset>
        <legend><strong>Comments</strong></legend>
        <label><input type="radio" name="comment_status" value="open" checked> Open</label>
        <label><input type="radio" name="comment_status" value="closed"> Closed</label>
    </fieldset>

    <p>
        <input type="submit" name="publish" value="Publish" style="font-weight: bold;">
        <input type="submit" name="draft" value="Save as Draft">
    </p>
</form>

{{template "admin-footer" .}}
{{end}}
