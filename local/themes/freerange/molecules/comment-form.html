<div class="comment-respond">
    {if comments_open}
    <h2>Leave a comment</h2>
    <form method="post" action="/comments" hx-post="/comments" hx-target="this" hx-swap="outerHTML">
        <input type="hidden" name="comment_post_id" value="{post_id}"/>
        <p>
            <label for="author">Name</label><br/>
            <input type="text" name="author" id="author" value="{saved_author}"/>
        </p>
        <p>
            <label for="email">Email</label><br/>
            <input type="email" name="email" id="email" value="{saved_email}"/>
        </p>
        <p>
            <label for="url">Website</label><br/>
            <input type="url" name="url" id="url" value="{saved_url}"/>
        </p>
        <p>
            <label for="comment">Comment</label><br/>
            <textarea name="comment" id="comment" rows="8" cols="50"></textarea>
        </p>
        <p><button type="submit">Submit Comment</button></p>
    </form>
    {else}
    <p class="comments-closed">Comments are closed.</p>
    {/if}
</div>
