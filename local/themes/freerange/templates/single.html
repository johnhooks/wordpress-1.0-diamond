<div id="wrapper">

<div id="header">
    <h1><a href="/">{blog_name}</a></h1>
    <p class="description">{blog_description}</p>
</div>

<div id="content">
    <post />
    <comment-list />
    {if comments_open}
    <div class="comment-respond">
        <h2>Leave a comment</h2>
        <comment-form />
    </div>
    {else}
    <p class="comments-closed">Comments are closed.</p>
    {/if}
    <post-navigation />
</div>

<sidebar />

</div>
