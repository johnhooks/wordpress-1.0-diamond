{{define "admin-textarea-field"}}
<p>
    <label for="{{.ID}}"><strong>{{.Label}}</strong>{{if .HelpText}} <small>({{.HelpText}})</small>{{end}}</label><br>
    <textarea name="{{.Name}}" id="{{.ID}}" rows="{{.Rows}}"
        style="width: 100%; box-sizing: border-box;">{{.Value}}</textarea>
    {{if .Error}}<br><small><strong>{{.Error}}</strong></small>{{end}}
</p>
{{end}}
