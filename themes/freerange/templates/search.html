<div id="wrapper">

<div id="header">
    <h1><a href="/">{blog_name}</a></h1>
    <p class="description">{blog_description}</p>
</div>

<div id="content">
    <h2>Search results for: {search_query}</h2>

    {if posts}
        {each posts as post}
            <post />
        {/each}
        <pagination />
    {else}
        <p>No results found.</p>
    {/if}
</div>

<sidebar />

</div>
